<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Jogos Online</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5775678596507244" crossorigin="anonymous"></script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = adConfig = function(o) {adsbygoogle.push(o);}
        adConfig({ preloadAdBreaks: 'on' });
    </script>

    <style>
        :root { --bg: #0d1117; --nav: #161b22; --border: #30363d; --text: #c9d1d9; --accent: #58a6ff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 5%; background: var(--nav); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .search-bar input { padding: 8px 15px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: white; width: 220px; }
        .categories { display: flex; gap: 10px; padding: 15px 5%; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .cat-btn { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 6px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .cat-btn.active { background: var(--accent); color: #000; font-weight: bold; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px 5%; }
        .game-card { background: var(--nav); border-radius: 8px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: 0.2s; }
        .game-card:hover { transform: translateY(-5px); border-color: #8b949e; }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .game-info { padding: 8px; font-size: 0.75rem; text-align: center; }
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 10px; right: 20px; font-size: 40px; color: white; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="font-weight: bold;">GAME<span style="color:var(--accent)">HUB</span></div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="Buscar jogos..."></div>
</nav>

<div class="categories">
    <button class="cat-btn active" onclick="filterGenre('All', this)">Todos</button>
    <button class="cat-btn" onclick="filterGenre('Action', this)">Ação</button>
    <button class="cat-btn" onclick="filterGenre('Adventure', this)">Aventura</button>
    <button class="cat-btn" onclick="filterGenre('Racing', this)">Corrida</button>
    <button class="cat-btn" onclick="filterGenre('Puzzle', this)">Puzzle</button>
</div>

<main class="game-grid" id="gameGrid"><div style="padding:50px; text-align:center; grid-column:1/-1;">Carregando jogos...</div></main>

<div id="gameModal" class="modal">
    <span class="close-btn" onclick="closeGame()">&times;</span>
    <iframe id="gameFrame" src="" allowfullscreen></iframe>
</div>

<script>
    // Proxy para evitar erro de carregamento (CORS)
    const FEED_URL = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://gamemonetize.com/feed.php?format=0&name=Sim&page=1");
    const grid = document.getElementById('gameGrid');
    let allGames = [];

    async function fetchGames() {
        try {
            const response = await fetch(FEED_URL);
            const data = await response.json();
            allGames = JSON.parse(data.contents); // Decodifica o conteúdo do proxy
            renderGames(allGames);
        } catch (error) {
            grid.innerHTML = "Erro ao carregar jogos. Tente desativar o AdBlock.";
        }
    }

    function renderGames(games) {
        grid.innerHTML = '';
        games.slice(0, 300).forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => launchGame(game.url);
            card.innerHTML = `<img src="${game.thumb}"><div class="game-info">${game.title}</div>`;
            grid.appendChild(card);
        });
    }

    function launchGame(url) {
        // Tenta rodar o anúncio, se falhar ou terminar, abre o jogo
        try {
            adBreak({
                type: 'start',
                name: 'play',
                beforeAd: () => console.log("Ad"),
                afterAd: () => openModal(url),
                adBreakDone: () => openModal(url)
            });
        } catch (e) {
            openModal(url); // Se o Google Ads der erro, abre o jogo direto
        }
    }

    function openModal(url) {
        const modal = document.getElementById('gameModal');
        const frame = document.getElementById('gameFrame');
        frame.src = url;
        modal.style.display = "block";
        document.body.style.overflow = "hidden";
    }

    function closeGame() {
        document.getElementById('gameModal').style.display = "none";
        document.getElementById('gameFrame').src = "";
        document.body.style.overflow = "auto";
    }

    // Pesquisa
    document.getElementById('searchInput').oninput = (e) => {
        const term = e.target.value.toLowerCase();
        renderGames(allGames.filter(g => g.title.toLowerCase().includes(term)));
    };

    function filterGenre(genre, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGames(genre === 'All' ? allGames : allGames.filter(g => g.category.includes(genre)));
    }

    fetchGames();
</script>
</body>
</html>
