<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Google H5 Ads Edition</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-SEU_PUBLISHER_ID" crossorigin="anonymous"></script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = adConfig = function(o) {adsbygoogle.push(o);}
    </script>

    <style>
        :root {
            --bg-dark: #0d1117;
            --nav-bg: #161b22;
            --border-color: #30363d;
            --text-link: #58a6ff;
            --text-main: #c9d1d9;
        }
        body { background: var(--bg-dark); color: var(--text-main); font-family: -apple-system, sans-serif; margin: 0; }
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 5%; background: var(--nav-bg); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: bold; font-size: 1.2rem; }
        .logo span { color: var(--text-link); }
        .search-bar input { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-dark); color: white; width: 250px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 25px 5%; }
        .game-card { background: var(--nav-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; cursor: pointer; transition: 0.2s; }
        .game-card:hover { transform: translateY(-5px); border-color: #8b949e; }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        .game-info { padding: 10px; font-size: 0.9rem; text-align: center; }
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 15px; right: 25px; font-size: 40px; color: white; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">GAME<span>HUB</span> (H5 Ads)</div>
    <div class="search-bar"><input type="text" id="searchInput" placeholder="Buscar jogos..."></div>
</nav>

<main class="game-grid" id="gameGrid">
    <p>Carregando jogos com Google Ads...</p>
</main>

<div id="gameModal" class="modal">
    <span class="close-btn">&times;</span>
    <div style="height: 100%; width: 100%;" id="container">
        <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>
</div>

<script>
    // Configuração do Google H5 Ads
    adConfig({
        preloadAdBreaks: 'on',
        onReady: () => { console.log('H5 Ads Ready'); },
    });

    const grid = document.getElementById('gameGrid');
    
    // Como você não usa mais GamePix, aqui você deve listar seus próprios jogos ou de outra fonte H5
    const games = [
        { title: "Exemplo Jogo 1", url: "URL_DO_JOGO_H5", thumb: "https://via.placeholder.com/150" },
        // Adicione seus jogos aqui
    ];

    function displayGames() {
        grid.innerHTML = '';
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => launchGame(game.url);
            card.innerHTML = `<img src="${game.thumb}"> <div class="game-info"><strong>${game.title}</strong></div>`;
            grid.appendChild(card);
        });
    }

    function launchGame(url) {
        // Antes de abrir o jogo, o Google tenta mostrar um anúncio (Ad Break)
        adBreak({
            type: 'start',
            name: 'inicio-do-jogo',
            beforeAd: () => { console.log('Anúncio vai começar'); },
            afterAd: () => { openModal(url); }, // Abre o jogo após o anúncio
            adBreakDone: () => { openModal(url); } // Abre o jogo se não houver anúncio disponível
        });
    }

    function openModal(url) {
        document.getElementById('gameFrame').src = url;
        document.getElementById('gameModal').style.display = "block";
    }

    document.querySelector('.close-btn').onclick = () => {
        document.getElementById('gameModal').style.display = "none";
        document.getElementById('gameFrame').src = "";
    };

    displayGames();
</script>
</body>
</html>
