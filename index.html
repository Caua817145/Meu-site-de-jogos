<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Milhares de Jogos</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5775678596507244" crossorigin="anonymous"></script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        const adBreak = adConfig = function(o) {adsbygoogle.push(o);}
        adConfig({ preloadAdBreaks: 'on' }); // Prepara os anúncios
    </script>

    <style>
        :root {
            --bg: #0d1117;
            --nav: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --accent: #58a6ff;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; margin: 0; overflow-x: hidden; }
        
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 5%; 
            background: var(--nav); 
            border-bottom: 1px solid var(--border); 
            position: sticky; top: 0; z-index: 100; 
        }

        .logo { font-weight: bold; font-size: 1.2rem; }
        .logo span { color: var(--accent); }

        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 20px; 
            padding: 25px 5%; 
        }

        .game-card { 
            background: var(--nav); 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            cursor: pointer; 
            transition: 0.2s; 
        }

        .game-card:hover { transform: translateY(-5px); border-color: #8b949e; }
        .game-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
        
        .game-info { padding: 10px; font-size: 0.85rem; text-align: center; font-weight: 500; }

        /* Modal do Player */
        .modal { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; }
        #gameFrame { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 15px; right: 25px; font-size: 40px; color: white; cursor: pointer; z-index: 1001; }
        
        #loader { grid-column: 1/-1; text-align: center; padding: 50px; color: var(--accent); }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">GAME<span>HUB</span></div>
    <div style="font-size: 0.7rem; color: #8b949e;">Powered by Google H5 Ads</div>
</nav>

<main class="game-grid" id="gameGrid">
    <div id="loader">Buscando jogos no catálogo...</div>
</main>

<div id="gameModal" class="modal">
    <span class="close-btn" onclick="closeGame()">&times;</span>
    <iframe id="gameFrame" src="" allowfullscreen></iframe>
</div>

<script>
    // SEU FEED DO GAMEMONETIZE
    const FEED_URL = "https://gamemonetize.com/feed.php?format=0&name=Sim&num=50&page=1";
    const grid = document.getElementById('gameGrid');
    let allGames = [];

    async function fetchGames() {
        try {
            const response = await fetch(FEED_URL);
            const data = await response.json();
            allGames = data;
            renderGames(allGames);
        } catch (error) {
            grid.innerHTML = "<p>Erro ao carregar o feed. Verifique se o link do GameMonetize está ativo.</p>";
        }
    }

    function renderGames(games) {
        grid.innerHTML = '';
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.onclick = () => launchGame(game.url);
            card.innerHTML = `
                <img src="${game.thumb}" alt="${game.title}" loading="lazy">
                <div class="game-info">${game.title}</div>
            `;
            grid.appendChild(card);
        });
    }

    function launchGame(url) {
        // DISPARA O ANÚNCIO DO GOOGLE ANTES DO JOGO
        adBreak({
            type: 'start',
            name: 'play-btn',
            beforeAd: () => { console.log('Ad starting'); },
            afterAd: () => { openModal(url); }, // Abre o jogo após o anúncio
            adBreakDone: () => { openModal(url); } 
        });
    }

    function openModal(url) {
        document.getElementById('gameFrame').src = url;
        document.getElementById('gameModal').style.display = "block";
        document.body.style.overflow = "hidden";
    }

    function closeGame() {
        document.getElementById('gameModal').style.display = "none";
        document.getElementById('gameFrame').src = "";
        document.body.style.overflow = "auto";
    }

    fetchGames();
</script>

</body>
</html>
